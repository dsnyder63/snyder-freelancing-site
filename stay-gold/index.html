<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Stay Gold Apparel. First drop coming soon. Built for the Different.">
<title>Stay Gold Apparel · Coming Soon</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<script>if(sessionStorage.getItem("sg_unlocked")==="1"){location.replace("/store/");}</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0B0B0B;color:#F2EDE3;font-family:Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
  .wrap{max-width:520px;width:100%;text-align:center}
  .logo{width:min(300px,72vw);height:auto;display:block;margin:0 auto 10px}
  h1{font-size:15px;letter-spacing:5px;color:#FFFFFF;font-weight:bold}
  .rule{width:64px;height:2px;background:#D4AF37;margin:16px auto}
  .soon{font-size:clamp(30px,8vw,44px);letter-spacing:3px;color:#D4AF37;font-weight:bold;line-height:1.15}
  .tag{margin-top:10px;font-size:16px;color:#EDE7D8}
  .diff{margin-top:4px;font-size:13px;letter-spacing:2px;color:#A99F8A;text-transform:uppercase}
  .copy{margin:22px auto 0;font-size:14.5px;line-height:1.6;color:#CFC8B8;max-width:420px}
  form{margin:26px auto 0;max-width:340px}
  label{display:block;font-size:11px;letter-spacing:2px;color:#A99F8A;text-transform:uppercase;margin-bottom:8px}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;background:#1A1A1A;border:1px solid #3A3A3A;border-radius:9px;color:#FFF;padding:12px 13px;font-size:16px;text-align:center}
  input:focus{outline:none;border-color:#D4AF37}
  button{background:#D4AF37;color:#0B0B0B;border:none;border-radius:9px;padding:12px 20px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:1px}
  button:active{transform:translateY(1px)}
  .err{min-height:20px;margin-top:10px;font-size:13.5px;color:#D98E7E}
  .foot{margin-top:38px;font-size:12px;color:#6E675A;line-height:1.7}
  .foot b{color:#A99F8A;font-weight:normal}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo-distressed-white.svg" alt="Stay Gold Apparel logo, distressed white gothic SG monogram in a diamond frame over crossed bones">
    <h1>STAY GOLD APPAREL</h1>
    <div class="rule"></div>
    <div class="soon">FIRST DROP<br>COMING SOON</div>
    <div class="tag">The store is getting its final touches.</div>
    <div class="diff">Built for the Different</div>
    <p class="copy">We are not open to the public just yet. If you have the password, come on in and look around.</p>
    <form id="gate" autocomplete="off">
      <label for="pw">Password</label>
      <div class="row">
        <input id="pw" type="password" placeholder="Enter password" aria-label="Password">
        <button type="submit">ENTER</button>
      </div>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">staygoldapparel.com<br><b>Site by Snyder Freelancing</b></div>
  </div>
<script>
  var HASH = "ab372d01868beb10e3884ccd1576a9423bda1bc1e7be786e2237dd1872bbd81f";
  function unlock(){ sessionStorage.setItem("sg_unlocked","1"); location.replace("/store/"); }
  async function digest(text){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }
  document.getElementById("gate").addEventListener("submit", async function(e){
    e.preventDefault();
    var val = document.getElementById("pw").value.trim().toLowerCase();
    var err = document.getElementById("err");
    if(!val){ err.textContent = "Type the password first."; return; }
    try {
      if(await digest(val) === HASH){ unlock(); return; }
    } catch(e2) {
      if(val === atob("cG9ueWJveQ==")){ unlock(); return; }
    }
    err.textContent = "That is not it. Try again.";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  });
</script>
</body>
</html>
